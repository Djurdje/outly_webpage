# Enkraten izrez zemljevida Slovenije iz Protomaps (PMTiles) za spletno aplikacijo (faza 3).
# Tece SAMO ob pushu na vejo karta-izrez (ne na main). Rezultat zapise nazaj na isto vejo:
# karta/velikosti.txt (velikosti po najvecji povecavi) in izreze, manjse od 24 MB (Cloudflare Pages: 25 MiB na datoteko).
name: Izrez zemljevida (Protomaps)
on:
  push:
    branches: [karta-izrez]
    paths: [".github/workflows/karta.yml"]
permissions:
  contents: write
jobs:
  izrez:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pmtiles CLI (go-pmtiles, zadnja izdaja)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download -R protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' -O pm.tgz
          tar xzf pm.tgz pmtiles && ./pmtiles version
      - name: Zadnja dnevna gradnja Protomaps
        run: |
          B=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | jq -r '.[-1].key')
          echo "gradnja: $B"; echo "GRADNJA=$B" >> "$GITHUB_ENV"
      - name: Izrezi
        run: |
          rm -f karta/*.pmtiles; mkdir -p karta
          SLO="13.37,45.42,16.62,46.88"
          LJ="14.35,45.97,14.66,46.15"
          MB="15.55,46.51,15.72,46.60"
          {
            echo "gradnja: $GRADNJA"
            for z in 9 10; do
              ./pmtiles extract "https://build.protomaps.com/$GRADNJA" "slo-z$z.pmtiles" --bbox="$SLO" --maxzoom=$z 2>/dev/null
              echo "slovenija maxzoom $z: $(stat -c %s slo-z$z.pmtiles) B"
            done
            ./pmtiles extract "https://build.protomaps.com/$GRADNJA" ljubljana.pmtiles --bbox="$LJ" --minzoom=11 --maxzoom=15 2>/dev/null
            echo "ljubljana z11-15: $(stat -c %s ljubljana.pmtiles) B"
            ./pmtiles extract "https://build.protomaps.com/$GRADNJA" maribor.pmtiles --bbox="$MB" --minzoom=11 --maxzoom=15 2>/dev/null
            echo "maribor z11-15: $(stat -c %s maribor.pmtiles) B"
          } | tee karta/velikosti.txt
          for f in slo-z*.pmtiles ljubljana.pmtiles maribor.pmtiles; do
            if [ "$(stat -c %s "$f")" -lt 24000000 ]; then cp "$f" karta/; fi
          done
          ls -la karta
      - name: Shrani na vejo karta-izrez
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A karta
          git commit -m "Izrez zemljevida Slovenije (Protomaps $GRADNJA)"
          git push origin HEAD:karta-izrez
