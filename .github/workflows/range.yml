name: Preveri produkcijo (zacasno)
on:
  push:
    branches: [preveri-range]
jobs:
  preveri:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://outly.si
          for i in $(seq 1 20); do
            s=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" "$U/vendor/jsqr-1.4.0.mjs"); case "$s" in *javascript*) break;; esac
            echo "poskus $i: $s"; sleep 20
          done
          for f in / /app/ /app/business/1/scan /webapp/js/views/posel-skener.js /vendor/jsqr-1.4.0.mjs /vendor/jsqr-LICENSE.txt; do
            echo "$f: $(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$U$f")"
          done
          echo "== glave /app/"; curl -sS -D - -o /dev/null "$U/app/" | grep -iE "^HTTP|permissions-policy|content-security"
          echo "== skener v kodi"; curl -s "$U/webapp/js/main.js" | grep -c "posel-skener"
          echo "== sl prevod"; curl -s "$U/webapp/js/i18n-sl.js" | grep -c "Skeniraj vstopnice"
