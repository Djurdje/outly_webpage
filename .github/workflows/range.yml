name: Preveri produkcijo (zacasno)
on:
  push:
    branches: [preveri-range]
jobs:
  preveri:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://outly.si
          for i in $(seq 1 20); do
            s=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" "$U/webapp/js/views/posel.js"); case "$s" in *javascript*) break;; esac
            echo "poskus $i: $s"; sleep 20
          done
          for f in / /app/ /app/business/1 /webapp/js/views/posel.js /webapp/js/views/posel-plosca.js /webapp/js/posel.js /karta/v20260929/slo/seznam.json; do
            echo "$f: $(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$U$f")"
          done
          curl -s "$U/webapp/js/main.js" | grep -c "SamoUredniki"
