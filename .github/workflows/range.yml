name: Preveri produkcijo (zacasno)
on:
  push:
    branches: [preveri-range]
jobs:
  preveri:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://outly.si
          for f in /webapp/js/views/home.js /webapp/js/main.js /webapp/sw.js /app/; do
            echo "== $f"; curl -sS -D - -o /tmp/f "$U$f" | grep -iE "^HTTP|cache-control|etag|age:|cf-cache-status|last-modified"
            echo "   OzadjeHome: $(grep -c OzadjeHome /tmp/f)"
          done
          echo "== z If-None-Match"; E=$(curl -sI "$U/webapp/js/views/home.js" | grep -i etag | cut -d' ' -f2 | tr -d '\r'); curl -sI -H "If-None-Match: $E" "$U/webapp/js/views/home.js" | head -1
