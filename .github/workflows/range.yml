name: Preveri ploscice (zacasno)
on:
  push:
    branches: [preveri-range]
jobs:
  ploscice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://outly.si
          for i in $(seq 1 30); do
            s=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" "$U/karta/v20260929/slo/seznam.json"); case "$s" in *html*) ;; 200*) break;; esac
            echo "poskus $i: $s"; sleep 30
          done
          for f in slo/seznam.json mesta/seznam.json slo/0/0/0.pbf mesta/15/17704/11637.pbf mesta/11/1105/727.pbf; do
            echo "== $f"; curl -sS --compressed -D - -o /tmp/k "$U/karta/v20260929/$f" | grep -iE "^HTTP|content-type|content-encoding|content-length|cache-control"
            echo "bajtov: $(wc -c < /tmp/k); zacetek: $(head -c 2 /tmp/k | od -An -tx1)"
          done
          echo "== neobstojeca"; curl -sS -o /dev/null -w "%{http_code} %{content_type}\n" "$U/karta/v20260929/slo/15/1/1.pbf"
          echo "== maplibre"; curl -sS -o /dev/null -w "%{http_code} %{content_type}\n" "$U/vendor/maplibre-gl-csp-worker-5.24.0.js"
          echo "== domaca"; curl -sS -o /dev/null -w "%{http_code}\n" "$U/"
          echo "== /app/map"; curl -sS -o /tmp/a -w "%{http_code}\n" "$U/app/map"; grep -o '<title>[^<]*' /tmp/a | head -1
          echo "== karta.js"; curl -sS "$U/webapp/js/karta.js" | grep -c "outly://"
