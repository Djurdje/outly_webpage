name: Preveri produkcijo (zacasno)
on:
  push:
    branches: [preveri-range]
jobs:
  preveri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cd .github/preveri && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node brskalnik.mjs
          for f in / /app/ /webapp/zagon.js /webapp/sw.js; do echo "$f: $(curl -s -o /dev/null -w '%{http_code} %{content_type}' "https://outly.si$f")"; done
          curl -s https://outly.si/webapp/sw.js | grep -o 'outly-app-[0-9]*' | head -1
