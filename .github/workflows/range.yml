name: Preveri produkcijo (zacasno)
on:
  push:
    branches: [preveri-range]
jobs:
  preveri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for f in / /app/ /webapp/js/main.js /webapp/js/views/posel-skener.js; do
            echo "$f: $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "https://outly.si$f")"
          done
          cd .github/preveri && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node brskalnik.mjs
