name: Preveri produkcijo (zacasno)
on:
  push:
    branches: [preveri-range]
jobs:
  preveri:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://outly.si
          for i in $(seq 1 20); do
            s=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" "$U/webapp/sw.js"); case "$s" in *javascript*) break;; esac
            echo "poskus $i: $s"; sleep 20
          done
          for f in / /app/ /app/event/1 /webapp/manifest.webmanifest /webapp/js/pwa.js; do
            echo "$f: $(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$U$f")"
          done
          echo "== sw"; curl -sS -D - -o /tmp/s "$U/webapp/sw.js" | grep -iE "^HTTP|service-worker"; grep -o 'outly-app-[0-9]*' /tmp/s | head -1
