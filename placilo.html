<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex" />
  <title>Payment – Outly</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .placilo{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
    .placilo h1{font-size:24px;margin:0}
    .placilo p{margin:0;opacity:.75;max-width:340px}
  </style>
</head>
<body>
  <main class="placilo">
    <img src="./assets/transperent-logo.png" alt="Outly" width="120">
    <h1 id="naslov">Payment received</h1>
    <p id="besedilo">Returning you to Outly…</p>
    <a class="btn btn--primary" id="nazaj" href="/app/tickets">Back to Outly</a>
  </main>
  <!-- Povratek s Stripe Checkouta (backend placila_stripe.js povratniNaslovi). app=ios -> outly://placilo zapre
       ASWebAuthenticationSession v iOS aplikaciji; brez app -> spletna aplikacija. Placilo vedno potrdi streznik (webhook). -->
  <script src="./placilo.js"></script>
</body>
</html>
